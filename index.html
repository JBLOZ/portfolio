        // --- 1. Cursor Personalizado ---
        const CustomCursor = () => {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [outlinePos, setOutlinePos] = useState({ x: 0, y: 0 });
            const requestRef = useRef();
            const previousTimeRef = useRef();

            useEffect(() => {
                const moveCursor = (e) => {
                    setMousePos({ x: e.clientX, y: e.clientY });
                    const target = e.target;
                    if (target.closest('a') || target.closest('button') || target.closest('.interactive')) {
                        document.body.classList.add('hovering');
                    } else {
                        document.body.classList.remove('hovering');
                    }
                };
                window.addEventListener('mousemove', moveCursor);
                
                const animateOutline = (time) => {
                    if (previousTimeRef.current !== undefined) {
                        setOutlinePos(prev => ({
                            x: prev.x + (mousePos.x - prev.x) * 0.15,
                            y: prev.y + (mousePos.y - prev.y) * 0.15
                        }));
                    }
                    previousTimeRef.current = time;
                    requestRef.current = requestAnimationFrame(animateOutline);
                };
                requestRef.current = requestAnimationFrame(animateOutline);

                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    cancelAnimationFrame(requestRef.current);
                };
            }, [mousePos]);

            return (
                <>
                    <div className="cursor-outline hidden md:block" style={{ left: `${outlinePos.x}px`, top: `${outlinePos.y}px` }} />
                    <div className="cursor-dot hidden md:block" style={{ left: `${mousePos.x}px`, top: `${mousePos.y}px` }} />
                </>
            );
        };

        const Background3D = () => {
            const mountRef = useRef(null);

            useEffect(() => {
                if (!mountRef.current) return;
                const container = mountRef.current;
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                const particlesGeometry = new THREE.BufferGeometry();
                const particlesCount = 1200;
                const posArray = new Float32Array(particlesCount * 3);
                for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 18;
                particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const material = new THREE.PointsMaterial({ size: 0.025, color: 0xa855f7, transparent: true, opacity: 0.6 });
                const particlesMesh = new THREE.Points(particlesGeometry, material);
                scene.add(particlesMesh);

                const geometry = new THREE.TorusKnotGeometry(3, 0.8, 100, 16);
                const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.08 });
                const torusKnot = new THREE.Mesh(geometry, wireframeMaterial);
                scene.add(torusKnot);

                camera.position.z = 6;

                let mouseX = 0, mouseY = 0;
                const onMove = (e) => { mouseX = e.clientX; mouseY = e.clientY; };
                document.addEventListener('mousemove', onMove);

                const clock = new THREE.Clock();
                let animationId;

                const animate = () => {
                    const t = clock.getElapsedTime();
                    particlesMesh.rotation.y = t * 0.03 + mouseX * 0.00005;
                    particlesMesh.rotation.x = mouseY * 0.00005;
                    torusKnot.rotation.x = t * 0.05;
                    torusKnot.rotation.y = t * 0.08;
                    renderer.render(scene, camera);
                    animationId = requestAnimationFrame(animate);
                };
                animate();

                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('mousemove', onMove);
                    cancelAnimationFrame(animationId);
                    if (container && renderer.domElement) container.removeChild(renderer.domElement);
                    geometry.dispose(); material.dispose(); renderer.dispose();
                };
            }, []);
            return <div ref={mountRef} style={{ position: 'fixed', top: 0, left: 0, zIndex: -1 }} />;
        };

                            >
                                Ver Más Proyectos ({ALL_PROJECTS.length})
                            </button>
                        </div>
                    </div>
                </section>
            )
        }

        const Contact = () => {
            return (
                <section id="contacto" className="min-h-screen flex flex-col justify-center px-6 relative overflow-hidden py-24">

                        <a href="mailto:jordiblloz@gmail.com" className="inline-block group relative overflow-hidden rounded-full bg-white text-black px-12 py-6 text-xl font-bold hover:scale-105 transition-transform interactive">

                        </a>
                        <div className="mt-24 flex flex-wrap justify-center gap-8 md:gap-16 text-gray-500 uppercase tracking-widest text-sm font-bold">
                            <a href="https://github.com/JBLOZ" target="_blank" className="hover:text-purple-400 transition-colors interactive">Github</a>
                            <a href="https://linkedin.com/in/jbloz" target="_blank" className="hover:text-purple-400 transition-colors interactive">LinkedIn</a>
                        </div>
                    </div>
                     <footer className="absolute bottom-6 w-full text-center text-gray-600 text-xs uppercase tracking-wider">
                        &copy; 2025 Jordi Blasco Lozano. Alicante, España.
                    </footer>
                </section>
            );
        };

            }, []);

            return (
                <motion.div 
                    initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                    className="min-h-screen py-32 px-6"
                >
                    <div className="container mx-auto">
                        <div className="mb-16 text-center">
                            <motion.div 
                                initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }}
                                className="inline-block mb-6"
                            >
                                <button 
                                    onClick={() => setView('home')}
                                    className="text-purple-400 hover:text-white flex items-center gap-2 uppercase tracking-widest text-sm font-bold mb-8 mx-auto transition-colors"
                                >
                                    <i data-lucide="arrow-left" className="w-4 h-4"></i> Volver al Inicio
                                </button>

                            <h1 className="text-4xl md:text-6xl font-bold mb-6">ARCHIVO DE <span className="text-purple-500">PROYECTOS</span></h1>
                            <p className="text-gray-400 max-w-2xl mx-auto">
                                Una colección completa de mis trabajos académicos, experimentos personales y desarrollos profesionales.
                            </p>
                        </div>

                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {ALL_PROJECTS.map((p, i) => (
                                <ProjectCard key={i} index={i} {...p} dense={true} />
                            ))}

                    </div>
                </motion.div>
            );
        }

        // --- Main App ---
        const App = () => {
            const [view, setView] = useState('home'); // 'home' | 'projects'

            useEffect(() => {
                if (typeof Lenis !== 'undefined') {
                    const lenis = new Lenis({
                        duration: 1.2,
                        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                        direction: 'vertical',
                        smooth: true,
                        smoothTouch: false,
                    });
                    function raf(time) {
                        lenis.raf(time);
                        requestAnimationFrame(raf);
                    }
                    requestAnimationFrame(raf);
                    return () => lenis.destroy();
                }
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [view]);

            return (
                <>
                    <CustomCursor />
                    <Background3D />
                    <Navbar view={view} setView={setView} />
                    <main>
                        <AnimatePresence mode="wait">
                            {view === 'home' ? (
                                <motion.div 
                                    key="home"
                                    initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                >
                                    <Hero />
                                    <About />
                                    <Skills />
                                    <Experience />
                                    <Education />
                                    <FeaturedProjects setView={setView} />
                                    <Contact />
                                </motion.div>
                            ) : (
                                <ProjectArchive key="projects" setView={setView} />
                            )}
                        </AnimatePresence>
                    </main>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
